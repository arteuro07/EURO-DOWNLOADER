plugins {
    id 'com.android.application'
}

android {
    namespace 'com.euro.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.euro.downloader'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:yt-dlp-android:2.0.2'
}
